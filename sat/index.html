<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SAT Library</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1e1e1e;
            color: #f0f0f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 0;
            touch-action: none;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            -webkit-touch-callout: none;
            user-select: none;
        }

        /* Controls panel — kept because it has functional benchmark controls */
        .ui-overlay {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1;
            background: rgba(20, 20, 20, 0.85);
            padding: 16px;
            border-radius: 8px;
            backdrop-filter: blur(6px);
            border: 1px solid #333;
            width: 220px;
        }

        h1 {
            margin: 0 0 12px 0;
            font-size: 16px;
            color: #fff;
        }

        p {
            margin: 0 0 12px 0;
            font-size: 12px;
            color: #aaa;
            line-height: 1.4;
        }

        .controls { margin-top: 8px; }

        button {
            background-color: #0e639c;
            color: white;
            border: none;
            padding: 7px 12px;
            width: 100%;
            cursor: pointer;
            font-size: 13px;
            border-radius: 4px;
            margin-bottom: 8px;
            transition: background 0.2s;
        }

        button:hover { background-color: #1177bb; }

        .checkbox-container,
        .slider-container {
            margin: 8px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: #ccc;
        }

        .slider-container input { width: 100px; }
    </style>
</head>

<body>
    <div class="ui-overlay">
        <h1>SAT Collision</h1>
        <p>Move mouse to control the Circle. Click to toggle Circle / Polygon.</p>

        <div class="controls">
            <button id="toggle-mode-btn">Switch to Benchmark</button>

            <div id="benchmark-controls" style="display: none;">
                <div class="checkbox-container">
                    <label for="debug-toggle">QuadTree Debug</label>
                    <input type="checkbox" id="debug-toggle" checked>
                </div>
                <div class="slider-container">
                    <label for="body-count">Bodies: <span id="body-count-value">100</span></label>
                    <input type="range" id="body-count" min="10" max="1000" value="100" step="10">
                </div>
            </div>
        </div>
    </div>

    <script src="./dist/index.js"></script>
</body>

</html>
