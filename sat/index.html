<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAT Library</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #f0f0f0;
            margin: 0;
            overflow: hidden;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
        }

        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1;
            background: rgba(30, 30, 30, 0.8);
            padding: 20px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            border: 1px solid #444;
            max-width: 300px;
            transition: width 0.3s, max-height 0.3s, padding 0.3s;
        }

        .ui-overlay.collapsed {
            width: 40px;
            height: 40px;
            max-height: 40px;
            padding: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .ui-overlay.collapsed>*:not(.collapse-btn) {
            display: none;
        }

        .collapse-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: transparent;
            border: none;
            color: #aaa;
            font-size: 16px;
            cursor: pointer;
            padding: 0;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }

        .collapse-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .ui-overlay.collapsed::after {
            content: '⚙️';
            font-size: 20px;
        }

        h1 {
            margin: 0 0 15px 0;
            font-size: 22px;
            color: #fff;
        }

        .controls {
            margin-top: 15px;
        }

        button {
            background-color: #0e639c;
            color: white;
            border: none;
            padding: 8px 16px;
            width: 100%;
            cursor: pointer;
            font-size: 14px;
            border-radius: 4px;
            margin-bottom: 10px;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #1177bb;
        }

        .checkbox-container,
        .slider-container {
            margin: 10px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .slider-container input {
            width: 120px;
        }

        .info {
            font-size: 12px;
            color: #aaa;
            margin-top: 15px;
            border-top: 1px solid #444;
            padding-top: 10px;
        }

        #instructions {
            font-size: 14px;
            margin-bottom: 15px;
            line-height: 1.4;
        }
    </style>
</head>

<body>
    <div class="ui-overlay" id="ui-overlay">
        <button class="collapse-btn" id="collapse-overlay" title="Toggle Panel">_</button>
        <h1>SAT Collision</h1>
        <p id="instructions">Move mouse to control the Circle. Click to toggle between Circle and Polygon control.</p>

        <div class="controls">
            <button id="toggle-mode-btn">Switch to Benchmark</button>

            <div id="benchmark-controls" style="display: none;">
                <div class="checkbox-container">
                    <label for="debug-toggle">Show QuadTree Debug</label>
                    <input type="checkbox" id="debug-toggle" checked>
                </div>
                <div class="slider-container">
                    <label for="body-count">Bodies: <span id="body-count-value">100</span></label>
                    <input type="range" id="body-count" min="10" max="300" value="100" step="10">
                </div>
            </div>
        </div>

        <div class="info">
            Built with craters game engine<br>
            SAT + QuadTree spatial partitioning
        </div>
    </div>

    <script src="./dist/index.js"></script>
</body>

</html>
